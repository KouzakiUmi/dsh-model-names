# 版本化发布：只有推 v* tag 才会出 Release。
# 安装方式（无需 npm registry）：
#   dsh plugin --profile desktop add https://github.com/KouzakiUmi/dsh-model-names/releases/download/v<version>/dsh-model-names.tgz
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Tag must match package.json version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version, name } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`tag ${process.env.RELEASE_TAG} does not match ${name}@${version}`);
          }
          console.log(`verified ${name}@${version}`);
          NODE

      - name: Manifest and syntax checks
        run: node scripts/check-manifest.mjs

      - name: Pack and validate release asset
        run: |
          npm pack --ignore-scripts --json > pack.json
          node scripts/prepare-release.mjs

      - name: Upload verified asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: dist/dsh-model-names.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: dist

      - name: Generate release notes without contributor announcements
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body > dist/release-notes.md
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'dist/release-notes.md';
          const notes = readFileSync(path, 'utf8').replace(
            /(?:^|\n)## New Contributors\r?\n[\s\S]*?(?=\n## |\n\*\*Full Changelog\*\*:|$)/u,
            '',
          );
          writeFileSync(path, notes.trim() + '\n');
          NODE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/dsh-model-names.tgz
          fail_on_unmatched_files: true
          body_path: dist/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  npm:
    needs: verify
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: dist

      - name: Publish verified package through npm Trusted Publisher
        run: npm publish ./dist/dsh-model-names.tgz --access public
